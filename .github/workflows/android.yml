name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          TILAWA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TILAWA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TILAWA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          TILAWA_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tilawa-apk
          path: app/build/outputs/apk/**/*.apk
